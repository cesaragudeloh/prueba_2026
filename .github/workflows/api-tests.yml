name: API Tests (Karate)

on:
  push:
    branches: [main]
    paths:
      - 'api_test/**'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

jobs:
  karate-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Run Karate test suite
        run: ./gradlew --no-daemon clean test

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api_test/build/karate-reports/**
            api_test/build/reports/tests/test/**
            api_test/build/test-results/test/**
          if-no-files-found: warn

