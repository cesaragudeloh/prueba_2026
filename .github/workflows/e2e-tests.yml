name: E2E Tests (Web)

on:
  push:
    branches: [main]
    paths:
      - 'e2e_test/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Run Serenity E2E suite
        run: xvfb-run --auto-servernum ./gradlew --no-daemon clean test aggregate

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: |
            e2e_test/target/site/serenity/**
            e2e_test/build/reports/tests/test/**
            e2e_test/build/test-results/test/**
          if-no-files-found: warn

